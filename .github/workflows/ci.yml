name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ./contracts -e ./services/orchestrator -e ./services/approval -e ./services/verifier -e ./services/codegen -e ./services/security -r ui/requirements.txt httpx pytest

      - name: Run gate tests
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packages and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e ./contracts -e ./services/orchestrator -e ./services/approval -e ./services/verifier -e ./services/codegen -e ./services/security -r ui/requirements.txt bandit pip-audit

      - name: Security scan (blocks on any unwaived high or critical finding)
        run: python scripts/run_security_scan.py
