name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ./contracts -e ./services/orchestrator -e ./services/approval -e ./services/verifier pytest

      - name: Run gate tests
        run: pytest -q
