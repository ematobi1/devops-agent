[project]
name = "devops-agent-approval"
version = "0.1.0"
description = "Human approval workflow and audit log; the only service allowed to trigger apply"
requires-python = ">=3.11"
dependencies = ["devops-agent-contracts"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
