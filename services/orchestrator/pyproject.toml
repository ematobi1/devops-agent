[project]
name = "devops-agent-orchestrator"
version = "0.1.0"
description = "Owns trigger -> Claude Code run -> approval -> apply policy for the DevOps agent"
requires-python = ">=3.11"
dependencies = ["devops-agent-contracts"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
