[project]
name = "devops-agent-security"
version = "0.1.0"
description = "Deterministic pre-deployment security scan: secrets, decision-log integrity, authentication config - no LLM calls"
requires-python = ">=3.11"
dependencies = ["devops-agent-contracts"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
